    <g transform="translate(15, 62)" font-size="12" fill="#e2e8f0">
      <text y="0" font-weight="bold" fill="#f59e0b">🔑 id</text><text x="290" y="0" fill="#94a3b8" text-anchor="end">UUID (PK)</text>
      <text y="24" font-weight="bold" fill="#a855f7">🔗 partie_id</text><text x="290" y="24" fill="#94a3b8" text-anchor="end">UUID (FK parties)</text>
      <text y="48">tour / phase</text><text x="290" y="48" fill="#94a3b8" text-anchor="end">INT / phase_partie</text>
