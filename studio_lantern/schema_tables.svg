    <path d="M 0 10 Q 0 0 10 0 L 270 0 Q 280 0 280 10 L 280 40 L 0 40 Z" fill="url(#userGrad)"/>
    <text x="15" y="26" fill="#ffffff" font-size="16" font-weight="bold">succes_joueurs</text>
    <text x="265" y="26" fill="#e0f2fe" font-size="11" text-anchor="end">TABLE</text>
    <g transform="translate(15, 62)" font-size="12" fill="#e2e8f0">
      <text y="0" font-weight="bold" fill="#38bdf8">🔗 joueur_id</text><text x="250" y="0" fill="#94a3b8" text-anchor="end">UUID (PK, FK)</text>
      <text y="24" font-weight="bold" fill="#38bdf8">🔗 succes_id</text><text x="250" y="24" fill="#94a3b8" text-anchor="end">UUID (PK, FK)</text>
      <text y="48">debloque_le</text><text x="250" y="48" fill="#94a3b8" text-anchor="end">TIMESTAMPTZ</text>
    </g>
