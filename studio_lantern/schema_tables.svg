      <text y="96">type_action</text><text x="290" y="96" fill="#94a3b8" text-anchor="end">type_action_jeu</text>
      <text y="120" font-weight="bold" fill="#f43f5e">🔗 joueur_cible_id</text><text x="290" y="120" fill="#94a3b8" text-anchor="end">UUID (FK)</text>
