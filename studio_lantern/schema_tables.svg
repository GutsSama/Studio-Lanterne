      <text y="96" font-weight="bold" fill="#a855f7">🔗 personnalite_ia_id</text><text x="310" y="96" fill="#94a3b8" text-anchor="end">UUID (FK personas, NULL)</text>
      <text y="120">nom_affiche</text><text x="310" y="120" fill="#94a3b8" text-anchor="end">TEXT</text>
      <text y="144">avatar_url</text><text x="310" y="144" fill="#94a3b8" text-anchor="end">TEXT</text>
      <text y="168" fill="#f43f5e" font-weight="bold">role</text><text x="310" y="168" fill="#f43f5e" text-anchor="end">role_personnage (RLS)</text>
      <text y="192">est_vivant</text><text x="310" y="192" fill="#94a3b8" text-anchor="end">BOOLEAN</text>
      <text y="216">est_capitaine</text><text x="310" y="216" fill="#94a3b8" text-anchor="end">BOOLEAN</text>
      <text y="240">tour_mort / cause_mort</text><text x="310" y="240" fill="#94a3b8" text-anchor="end">INT / TEXT</text>
      <text y="264">numero_siege</text><text x="310" y="264" fill="#94a3b8" text-anchor="end">INT UNIQUE</text>
      <text y="288">memoire_ia</text><text x="310" y="288" fill="#94a3b8" text-anchor="end">JSONB</text>
    </g>
  </g>

  <!-- 7. MESSAGES_PARTIE -->
  <g transform="translate(1230, 130)" filter="url(#shadow)">
    <rect width="320" height="260" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 10 Q 0 0 10 0 L 310 0 Q 320 0 320 10 L 320 40 L 0 40 Z" fill="url(#msgGrad)"/>
    <text x="15" y="26" fill="#ffffff" font-size="16" font-weight="bold">messages_partie</text>
    <text x="305" y="26" fill="#d1fae5" font-size="11" text-anchor="end">CHAT &amp; SECRET</text>
    <g transform="translate(15, 62)" font-size="12" fill="#e2e8f0">
      <text y="0" font-weight="bold" fill="#10b981">🔑 id</text><text x="290" y="0" fill="#94a3b8" text-anchor="end">UUID (PK)</text>
      <text y="24" font-weight="bold" fill="#a855f7">🔗 partie_id</text><text x="290" y="24" fill="#94a3b8" text-anchor="end">UUID (FK parties)</text>
      <text y="48" font-weight="bold" fill="#f43f5e">🔗 joueur_emetteur_id</text><text x="290" y="48" fill="#94a3b8" text-anchor="end">UUID (FK joueurs)</text>
      <text y="72" fill="#10b981" font-weight="bold">canal</text><text x="290" y="72" fill="#10b981" text-anchor="end">canal_message (RLS)</text>
      <text y="96">tour / phase</text><text x="290" y="96" fill="#94a3b8" text-anchor="end">INT / phase_partie</text>
      <text y="120">contenu</text><text x="290" y="120" fill="#94a3b8" text-anchor="end">TEXT</text>
      <text y="144">est_ia</text><text x="290" y="144" fill="#94a3b8" text-anchor="end">BOOLEAN</text>
      <text y="168" fill="#fbbf24">tokens_utilises</text><text x="290" y="168" fill="#fbbf24" text-anchor="end">INT (TRIGGER)</text>
