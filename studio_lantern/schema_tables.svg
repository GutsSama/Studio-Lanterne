  <!-- RELATION LINES & LABELS -->
  <path d="M 330 200 L 420 200" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4" fill="none"/>
  <path d="M 740 200 L 820 200" stroke="#a855f7" stroke-width="2.5" fill="none"/>
  <path d="M 1160 200 L 1230 200" stroke="#f43f5e" stroke-width="2.5" fill="none"/>
  <path d="M 1160 300 L 1200 300 L 1200 500 L 1230 500" stroke="#f43f5e" stroke-width="2" fill="none"/>
  <path d="M 1160 350 L 1190 350 L 1190 780 L 1230 780" stroke="#f43f5e" stroke-width="2" fill="none"/>
  <path d="M 740 600 L 800 600 L 800 380 L 820 380" stroke="#a855f7" stroke-width="2" fill="none"/>

  <!-- LEGEND FOOTER -->
  <g transform="translate(420, 800)" filter="url(#shadow)">
    <rect width="740" height="260" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="35" fill="#f8fafc" font-size="15" font-weight="bold">Légende &amp; Règles d'Architecture Supabase :</text>
    
    <g transform="translate(25, 65)" font-size="12" fill="#cbd5e1">
      <circle cx="10" cy="5" r="5" fill="#38bdf8"/>
      <text x="25" y="9" font-weight="bold">Sécurité &amp; RLS Anti-Triche :</text>
      <text x="210" y="9">Le joueur humain ne peut requêter le canal secret 'creature_secret' que s'il est Créature.</text>
      
      <circle cx="10" cy="35" r="5" fill="#fbbf24"/>
      <text x="25" y="39" font-weight="bold">Mesure Coûts Low-Cost :</text>
      <text x="210" y="39">Trigger automatique calculant tokens_total_utilises et cout_estime_usd sur la table parties.</text>
      
      <circle cx="10" cy="65" r="5" fill="#34d399"/>
      <text x="25" y="69" font-weight="bold">Conformité AI Act / RGPD :</text>
      <text x="210" y="69">Minimisation des données (pseudo/avatar), consentement explicite AI Act horodaté.</text>

      <circle cx="10" cy="95" r="5" fill="#f43f5e"/>
      <text x="25" y="99" font-weight="bold">Intégrité Moteur de Règles :</text>
      <text x="210" y="99">Contraintes CHECK garantissant qu'un joueur est soit humain, soit piloté par une personnalité IA.</text>

      <circle cx="10" cy="125" r="5" fill="#a855f7"/>
      <text x="25" y="129" font-weight="bold">Relations &amp; Clés Étrangères :</text>
      <text x="210" y="129">Toutes les suppressions de comptes se propagent en cascade (ON DELETE CASCADE).</text>
    </g>
  </g>
</svg>
