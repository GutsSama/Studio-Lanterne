      <text y="24" font-weight="bold" fill="#38bdf8">🔗 hote_id</text><text x="290" y="24" fill="#94a3b8" text-anchor="end">UUID (FK profils)</text>
      <text y="48">statut</text><text x="290" y="48" fill="#94a3b8" text-anchor="end">statut_partie (ENUM)</text>
      <text y="72">phase_actuelle</text><text x="290" y="72" fill="#94a3b8" text-anchor="end">phase_partie (ENUM)</text>
      <text y="96">tour_actuel</text><text x="290" y="96" fill="#94a3b8" text-anchor="end">INT</text>
      <text y="120">camp_vainqueur</text><text x="290" y="120" fill="#94a3b8" text-anchor="end">camp_partie (ENUM)</text>
      <text y="144" fill="#fbbf24" font-weight="bold">tokens_total_utilises</text><text x="290" y="144" fill="#fbbf24" text-anchor="end">INT (TRIGGER)</text>
      <text y="168" fill="#fbbf24" font-weight="bold">cout_estime_usd</text><text x="290" y="168" fill="#fbbf24" text-anchor="end">NUMERIC (10,6)</text>
