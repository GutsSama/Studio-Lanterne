    <linearGradient id="voteGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- TITLE HEADER -->
  <text x="800" y="55" fill="#f8fafc" font-size="28" font-weight="bold" text-anchor="middle" letter-spacing="1">STUDIO LANTERNE — SCHÉMA DE LA BASE DE DONNÉES (POSTGRESQL / SUPABASE)</text>
  <text x="800" y="85" fill="#94a3b8" font-size="14" text-anchor="middle">Modèle relationnel français avec RLS anti-triche, suivi des coûts en tokens et conformité RGPD / AI Act</text>

  <!-- GRID / TABLE CARDS -->

  <!-- 1. PROFILS -->
  <g transform="translate(50, 130)" filter="url(#shadow)">
    <rect width="280" height="230" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 10 Q 0 0 10 0 L 270 0 Q 280 0 280 10 L 280 40 L 0 40 Z" fill="url(#userGrad)"/>
    <text x="15" y="26" fill="#ffffff" font-size="16" font-weight="bold">profils</text>
    <text x="265" y="26" fill="#e0f2fe" font-size="11" text-anchor="end">TABLE</text>
    <g transform="translate(15, 62)" font-size="12" fill="#e2e8f0">
      <text y="0" font-weight="bold" fill="#38bdf8">🔑 id</text><text x="250" y="0" fill="#94a3b8" text-anchor="end">UUID (PK)</text>
      <text y="24">nom_utilisateur</text><text x="250" y="24" fill="#94a3b8" text-anchor="end">TEXT UNIQUE</text>
      <text y="48">avatar_url</text><text x="250" y="48" fill="#94a3b8" text-anchor="end">TEXT</text>
      <text y="72" fill="#34d399">consentement_ai_act</text><text x="250" y="72" fill="#94a3b8" text-anchor="end">BOOLEAN</text>
      <text y="96">date_consentement_ai_act</text><text x="250" y="96" fill="#94a3b8" text-anchor="end">TIMESTAMPTZ</text>
      <text y="120">cree_le</text><text x="250" y="120" fill="#94a3b8" text-anchor="end">TIMESTAMPTZ</text>
      <text y="144">mis_a_jour_le</text><text x="250" y="144" fill="#94a3b8" text-anchor="end">TIMESTAMPTZ</text>
    </g>
  </g>

  <!-- 2. STATISTIQUES_JOUEURS -->
  <g transform="translate(50, 400)" filter="url(#shadow)">
    <rect width="280" height="250" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 10 Q 0 0 10 0 L 270 0 Q 280 0 280 10 L 280 40 L 0 40 Z" fill="url(#userGrad)"/>
    <text x="15" y="26" fill="#ffffff" font-size="16" font-weight="bold">statistiques_joueurs</text>
    <text x="265" y="26" fill="#e0f2fe" font-size="11" text-anchor="end">TABLE</text>
    <g transform="translate(15, 62)" font-size="12" fill="#e2e8f0">
      <text y="0" font-weight="bold" fill="#38bdf8">🔗 joueur_id</text><text x="250" y="0" fill="#94a3b8" text-anchor="end">UUID (PK, FK)</text>
      <text y="24">parties_jouees</text><text x="250" y="24" fill="#94a3b8" text-anchor="end">INT</text>
      <text y="48">parties_gagnees</text><text x="250" y="48" fill="#94a3b8" text-anchor="end">INT</text>
      <text y="72">parties_perdues</text><text x="250" y="72" fill="#94a3b8" text-anchor="end">INT</text>
      <text y="96">victoires_citoyens</text><text x="250" y="96" fill="#94a3b8" text-anchor="end">INT</text>
      <text y="120">victoires_creatures</text><text x="250" y="120" fill="#94a3b8" text-anchor="end">INT</text>
      <text y="144">victoires_solo</text><text x="250" y="144" fill="#94a3b8" text-anchor="end">INT</text>
      <text y="168">temps_de_jeu_total_secondes</text><text x="250" y="168" fill="#94a3b8" text-anchor="end">BIGINT</text>
    </g>
  </g>

  <!-- 3. SUCCES & SUCCES_JOUEURS -->
  <g transform="translate(50, 690)" filter="url(#shadow)">
    <rect width="280" height="200" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 10 Q 0 0 10 0 L 270 0 Q 280 0 280 10 L 280 40 L 0 40 Z" fill="url(#userGrad)"/>
    <text x="15" y="26" fill="#ffffff" font-size="16" font-weight="bold">succes</text>
    <text x="265" y="26" fill="#e0f2fe" font-size="11" text-anchor="end">TABLE</text>
    <g transform="translate(15, 62)" font-size="12" fill="#e2e8f0">
