      <text y="216">creee_le</text><text x="290" y="216" fill="#94a3b8" text-anchor="end">TIMESTAMPTZ</text>
    </g>
  </g>

  <!-- 5. PERSONNALITES_IA -->
  <g transform="translate(420, 520)" filter="url(#shadow)">
    <rect width="320" height="230" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 10 Q 0 0 10 0 L 310 0 Q 320 0 320 10 L 320 40 L 0 40 Z" fill="url(#gameGrad)"/>
    <text x="15" y="26" fill="#ffffff" font-size="16" font-weight="bold">personnalites_ia</text>
    <text x="305" y="26" fill="#f3e8ff" font-size="11" text-anchor="end">CATALOGUE</text>
    <g transform="translate(15, 62)" font-size="12" fill="#e2e8f0">
      <text y="0" font-weight="bold" fill="#a855f7">🔑 id</text><text x="290" y="0" fill="#94a3b8" text-anchor="end">UUID (PK)</text>
      <text y="24">nom</text><text x="290" y="24" fill="#94a3b8" text-anchor="end">TEXT</text>
      <text y="48">archetype</text><text x="290" y="48" fill="#94a3b8" text-anchor="end">TEXT</text>
      <text y="72">avatar_url</text><text x="290" y="72" fill="#94a3b8" text-anchor="end">TEXT</text>
